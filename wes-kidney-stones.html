<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WES' KIDNEY STONES</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; display: block; }
  #wrap { position: relative; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff;
    font-family: "Courier New", monospace; text-align: center; pointer-events: none;
  }
  .overlay h1 { font-size: 42px; letter-spacing: 6px; margin: 0 0 8px; font-weight: bold; }
  .overlay h2 { font-size: 18px; letter-spacing: 3px; margin: 0 0 24px; color: #ffcc66; font-weight: normal; }
  .overlay p { font-size: 15px; letter-spacing: 2px; margin: 4px 0; }
  .blink { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="650"></canvas>
  <div id="titleScreen" class="overlay">
    <h1>WES' KIDNEY STONES</h1>
    <h2>THEY MUST BE DESTROYED. FOR HIS SAKE.</h2>
    <p>&#8593; THRUST &nbsp; &#8592; &#8594; ROTATE &nbsp; SPACE FIRE</p>
    <p style="margin-top:20px" class="blink">PRESS ENTER TO START</p>
  </div>
  <div id="gameOverScreen" class="overlay hidden">
    <h1>GAME OVER</h1>
    <h2 id="goMsg">THE STONES HAVE WON</h2>
    <p id="goScore"></p>
    <p id="goHigh"></p>
    <p style="margin-top:20px" class="blink">PRESS ENTER TO TRY AGAIN</p>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const titleScreen = document.getElementById('titleScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const goScore = document.getElementById('goScore');
  const goHigh = document.getElementById('goHigh');
  const goMsg = document.getElementById('goMsg');

  const goMessages = [
    "THE STONES HAVE WON",
    "WES IS NOT GOING TO MAKE IT",
    "DRINK MORE WATER, WES",
    "CALCIUM OXALATE: 1  YOU: 0",
    "THAT ONE WAS 4MM. IT'S NOT PASSING."
  ];

  // ---- State ----
  let state = 'title'; // title | playing | gameover
  let ship, bullets, stones, particles;
  let score = 0, highScore = 0, lives = 3, level = 0;
  let respawnTimer = 0, levelTimer = 0;
  const keys = {};

  // ---- Helpers ----
  const rand = (a, b) => a + Math.random() * (b - a);
  const wrap = o => {
    if (o.x < -o.r) o.x = W + o.r; if (o.x > W + o.r) o.x = -o.r;
    if (o.y < -o.r) o.y = H + o.r; if (o.y > H + o.r) o.y = -o.r;
  };
  const dist2 = (a, b) => (a.x-b.x)**2 + (a.y-b.y)**2;

  // ---- Ship ----
  function newShip() {
    return { x: W/2, y: H/2, r: 12, a: -Math.PI/2, vx: 0, vy: 0,
             thrusting: false, inv: 180, cooldown: 0, dead: false };
  }

  // ---- Kidney stones (lumpy jagged polygons) ----
  function newStone(x, y, size) {
    // size: 3 = large, 2 = medium, 1 = small
    const r = size === 3 ? 48 : size === 2 ? 26 : 14;
    const n = Math.floor(rand(9, 14));
    const offs = [];
    for (let i = 0; i < n; i++) offs.push(rand(0.65, 1.25));
    const sp = (1.4 - size * 0.25) * (1 + level * 0.12);
    const ang = rand(0, Math.PI * 2);
    return { x, y, r, size, offs, n,
             vx: Math.cos(ang) * sp * rand(0.6, 1.4),
             vy: Math.sin(ang) * sp * rand(0.6, 1.4),
             rot: rand(-0.02, 0.02), a: rand(0, Math.PI * 2) };
  }

  function spawnLevel() {
    stones = [];
    const count = 3 + level;
    for (let i = 0; i < count; i++) {
      let x, y;
      do { x = rand(0, W); y = rand(0, H); }
      while ((x-W/2)**2 + (y-H/2)**2 < 200**2);
      stones.push(newStone(x, y, 3));
    }
  }

  function startGame() {
    score = 0; lives = 3; level = 0;
    ship = newShip(); bullets = []; particles = [];
    spawnLevel();
    state = 'playing';
    titleScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
  }

  function gameOver() {
    state = 'gameover';
    if (score > highScore) highScore = score;
    goScore.textContent = 'SCORE: ' + score;
    goHigh.textContent = 'HIGH SCORE: ' + highScore;
    goMsg.textContent = goMessages[Math.floor(Math.random() * goMessages.length)];
    gameOverScreen.classList.remove('hidden');
  }

  // ---- Particles ----
  function burst(x, y, n, speed, life, color) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(0.3, speed);
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
                       life: rand(life*0.5, life), color });
    }
  }

  // ---- Input ----
  addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
    if (e.key === 'Enter' && state !== 'playing') startGame();
  });
  addEventListener('keyup', e => keys[e.key] = false);

  // ---- Update ----
  function update() {
    if (state !== 'playing') return;

    // Ship
    if (!ship.dead) {
      if (keys['ArrowLeft'])  ship.a -= 0.07;
      if (keys['ArrowRight']) ship.a += 0.07;
      ship.thrusting = !!keys['ArrowUp'];
      if (ship.thrusting) {
        ship.vx += Math.cos(ship.a) * 0.09;
        ship.vy += Math.sin(ship.a) * 0.09;
      }
      ship.vx *= 0.99; ship.vy *= 0.99;
      ship.x += ship.vx; ship.y += ship.vy;
      wrap(ship);
      if (ship.inv > 0) ship.inv--;
      if (ship.cooldown > 0) ship.cooldown--;
      if (keys[' '] && ship.cooldown === 0) {
        bullets.push({ x: ship.x + Math.cos(ship.a)*ship.r,
                       y: ship.y + Math.sin(ship.a)*ship.r,
                       vx: Math.cos(ship.a)*7 + ship.vx,
                       vy: Math.sin(ship.a)*7 + ship.vy,
                       r: 2, life: 70 });
        ship.cooldown = 14;
      }
    } else {
      respawnTimer--;
      if (respawnTimer <= 0) {
        if (lives > 0) { ship = newShip(); }
        else gameOver();
      }
    }

    // Bullets
    for (let i = bullets.length-1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      wrap(b);
      if (b.life <= 0) bullets.splice(i, 1);
    }

    // Stones
    for (const s of stones) {
      s.x += s.vx; s.y += s.vy; s.a += s.rot;
      wrap(s);
    }

    // Bullet vs stone
    for (let i = stones.length-1; i >= 0; i--) {
      const s = stones[i];
      for (let j = bullets.length-1; j >= 0; j--) {
        const b = bullets[j];
        if (dist2(s, b) < (s.r*0.9)**2) {
          bullets.splice(j, 1);
          stones.splice(i, 1);
          score += s.size === 3 ? 20 : s.size === 2 ? 50 : 100;
          burst(s.x, s.y, 10 + s.size*4, 2.5, 40, '#ffcc66');
          if (s.size > 1) {
            stones.push(newStone(s.x, s.y, s.size-1));
            stones.push(newStone(s.x, s.y, s.size-1));
          }
          break;
        }
      }
    }

    // Stone vs ship
    if (!ship.dead && ship.inv === 0) {
      for (const s of stones) {
        if (dist2(s, ship) < (s.r*0.85 + ship.r*0.7)**2) {
          ship.dead = true;
          lives--;
          respawnTimer = 100;
          burst(ship.x, ship.y, 30, 3.5, 60, '#fff');
          break;
        }
      }
    }

    // Particles
    for (let i = particles.length-1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Next level
    if (stones.length === 0) {
      levelTimer++;
      if (levelTimer > 90) { level++; levelTimer = 0; spawnLevel(); }
    }
  }

  // ---- Draw ----
  function drawShip(s) {
    if (s.inv > 0 && Math.floor(s.inv / 8) % 2 === 0) return; // flicker
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.a);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(-10, 9);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-10, -9);
    ctx.closePath();
    ctx.stroke();
    if (s.thrusting && Math.random() > 0.3) {
      ctx.beginPath();
      ctx.moveTo(-7, 4);
      ctx.lineTo(-15 - Math.random()*6, 0);
      ctx.lineTo(-7, -4);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawStone(s) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.a);
    ctx.strokeStyle = '#e8d9a0'; // calcified off-white
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < s.n; i++) {
      const ang = (i / s.n) * Math.PI * 2;
      const rr = s.r * s.offs[i];
      const x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    // a couple of crystalline cracks for texture
    if (s.size > 1) {
      ctx.beginPath();
      ctx.moveTo(-s.r*0.3, -s.r*0.2); ctx.lineTo(s.r*0.1, s.r*0.15);
      ctx.moveTo(s.r*0.2, -s.r*0.3); ctx.lineTo(s.r*0.35, 0);
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    if (state === 'title') {
      // gentle drifting stones behind title
      return;
    }

    for (const s of stones) drawStone(s);

    ctx.fillStyle = '#fff';
    for (const b of bullets) ctx.fillRect(b.x-1.5, b.y-1.5, 3, 3);

    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life / 20);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-1, p.y-1, 2, 2);
    }
    ctx.globalAlpha = 1;

    if (!ship.dead) drawShip(ship);

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = '20px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 20, 32);
    ctx.textAlign = 'center';
    ctx.fillText('HIGH ' + Math.max(highScore, score), W/2, 32);
    ctx.textAlign = 'right';
    ctx.fillText('LEVEL ' + (level+1), W-20, 32);
    // lives as little ships
    for (let i = 0; i < lives; i++) {
      ctx.save();
      ctx.translate(30 + i*26, 58);
      ctx.rotate(-Math.PI/2);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(9, 0); ctx.lineTo(-7, 6); ctx.lineTo(-4, 0); ctx.lineTo(-7, -6);
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
